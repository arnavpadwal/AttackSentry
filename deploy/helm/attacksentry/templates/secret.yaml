apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attacksentry.fullname" . }}-secret
  labels:
    {{- include "attacksentry.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "global.secretKey is required" .Values.global.secretKey | quote }}
  bootstrap-admin-password: {{ required "global.bootstrapAdminPassword is required" .Values.global.bootstrapAdminPassword | quote }}
  db-password: {{ required "database.password is required" .Values.database.password | quote }}
  nats-password: {{ required "nats.password is required" .Values.nats.password | quote }}
  llm-api-key: {{ .Values.backend.llm.apiKey | quote }}
  webhook-secret: {{ .Values.backend.integrations.webhookSecret | quote }}
