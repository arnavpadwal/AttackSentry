apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attacksentry.fullname" . }}-frontend
  labels: {{- include "attacksentry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: { app: attacksentry-frontend }
  template:
    metadata:
      labels: { app: attacksentry-frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          env:
            - name: BACKEND_URL
              value: "http://{{ include "attacksentry.fullname" . }}-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "attacksentry.fullname" . }}-frontend
  labels: {{- include "attacksentry.labels" . | nindent 4 }}
spec:
  ports: [{ port: 80, targetPort: 80 }]
  selector: { app: attacksentry-frontend }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "attacksentry.fullname" . }}-ingress
  {{- if .Values.ingress.tlsSecret }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  {{- end }}
spec:
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "attacksentry.fullname" . }}-frontend
                port: { number: 80 }
{{- end }}
